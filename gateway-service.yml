spring:
  application:
    name: gateway-service



  cloud:
    gateway:
      server:
        webmvc:
          routes:
            -
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/users/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/orders/**


server:
  port: ${SERVER_PORT:8080}


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

