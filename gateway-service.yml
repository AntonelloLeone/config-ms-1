spring:
  application:
    name: gateway-service



  cloud:
    gateway:
      mvc:
        routes:
          - id: user-service
            uri: lb://USER-SERVICE
            predicates:
              - Path=/users/**


server:
  port: ${SERVER_PORT:8080}


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

